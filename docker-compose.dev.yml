# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  db:
    image: postgres:15
    container_name: exam_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: examdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7
    container_name: exam_redis
    ports:
      - "6379:6379"
  api:
    build: .
    restart: always
    container_name: exam_api
    env_file:
      - .env.local
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./reports_data:/app/reports
    command: [
      "uvicorn",
      "app.main:app",
      "--host", "0.0.0.0",
      "--port", "8000",
      "--reload"
    ]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  worker:
    build: .
    container_name: exam_worker
    command: celery -A app.core.celery_app.celery worker --loglevel=info
    env_file:
      - .env.local
    environment:
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
      - ./reports_data:/app/reports
  frontend:
    build: ./frontend
    container_name: exam_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api
    env_file:
      - .env.local
    command: sh -c "npm install && npm run dev"
  kafka:
    image: apache/kafka:4.0.1
    container_name: exam-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      TZ: America/Mexico_City
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"
        ]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s
  outbox-worker:
    build: .
    container_name: exam_outbox_worker
    restart: unless-stopped
    command: python -m app.kafka_workers.outbox_worker
    env_file:
      - .env.local
    environment:
      PYTHONPATH: /app
      TZ: America/Mexico_City
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - .:/app
  kafka-consumer:
    build: .
    container_name: exam_kafka_consumer
    restart: unless-stopped
    command: python -m app.kafka.consumer
    env_file:
      - .env.local
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      TZ: America/Mexico_City
    depends_on:
      kafka:
        condition: service_started
    volumes:
      - .:/app
volumes:
  postgres_data:
  reports_data:
  frontend_node_modules:

